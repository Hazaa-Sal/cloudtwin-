name: CloudTwin validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test health behavior
        run: python -m unittest discover -s tests -v
      - name: Validate scripts and render both environments
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Build container
        run: docker build -t cloudtwin-api:ci .
